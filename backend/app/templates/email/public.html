# app/templates/email/public.html


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ subject }}</title>
</head>

<body
    style="
        margin: 0;
        padding: 0;
        background-color: #f4f6f8;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
    "
>

    <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="
            background-color: #f4f6f8;
            padding: 40px 16px;
        "
    >

        <tr>
            <td align="center">

                <table
                    width="100%"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    style="
                        max-width: 600px;
                        background-color: #ffffff;
                        border-radius: 14px;
                        overflow: hidden;
                        border: 1px solid #e5e7eb;
                    "
                >

                    <!-- Header -->

                    <tr>
                        <td
                            style="
                                padding: 28px 32px;
                                border-bottom: 1px solid #eef0f2;
                            "
                        >

                            <div
                                style="
                                    font-size: 24px;
                                    font-weight: 700;
                                    color: #111827;
                                    letter-spacing: -0.5px;
                                "
                            >
                                Workora
                            </div>

                        </td>
                    </tr>


                    <!-- Content -->

                    <tr>
                        <td
                            style="
                                padding: 40px 32px;
                            "
                        >

                            <h1
                                style="
                                    margin: 0 0 20px 0;
                                    font-size: 28px;
                                    line-height: 1.3;
                                    font-weight: 700;
                                    color: #111827;
                                "
                            >
                                {{ subject }}
                            </h1>

                            <p
                                style="
                                    margin: 0;
                                    font-size: 16px;
                                    line-height: 1.7;
                                    color: #4b5563;
                                    white-space: pre-line;
                                "
                            >
                                {{ detail }}
                            </p>

                        </td>
                    </tr>


                    <!-- Footer -->

                    <tr>
                        <td
                            style="
                                padding: 24px 32px;
                                background-color: #f9fafb;
                                border-top: 1px solid #eef0f2;
                            "
                        >

                            <p
                                style="
                                    margin: 0;
                                    font-size: 13px;
                                    line-height: 1.6;
                                    color: #9ca3af;
                                "
                            >
                                This email was sent by Workora.
                            </p>

                            <p
                                style="
                                    margin: 6px 0 0 0;
                                    font-size: 13px;
                                    color: #9ca3af;
                                "
                            >
                                © Workora
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </table>

</body>
</html>
